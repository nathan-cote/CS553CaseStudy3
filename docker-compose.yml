# This dockercompose file was originally created by Claude Opus 5.5 on Medium Thinking with the context of our port range of 3001-3010 and the 3 containers needed to facilitate the docker container build and run process. I've made manual updates to improve it afterwards.

name: group3

services:
  app:
    build: .
    image: group3/casestudy3-app
    container_name: group3-app
    ports:
      - "127.0.0.1:3001:7860"   # Gradio
    restart: unless-stopped
    networks:
      - monitoring

  prometheus:
    build: ./Prometheus
    image: group3/casestudy3-prometheus
    container_name: group3-prometheus
    ports:
      - "127.0.0.1:3002:9090"
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    build: ./Grafana
    image: casestudy3-grafana
    container_name: group3-grafana
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
    volumes:
      - grafana-data:/var/lib/grafana   # keeps dashboards/data sources across restarts
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana-data:

networks:
  monitoring:
    external: true